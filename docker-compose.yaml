# Chatwoot (fork propio) para Dokploy
# Compose Path: ./docker-compose.yaml  |  Compose Type: Docker Compose
# Dominio: pestaña Domains de Dokploy → service "chatwoot", port 3000

version: "3.8"

x-chatwoot-base: &chatwoot-base
  build:
    context: .
    dockerfile: ./docker/Dockerfile
    args:
      BUNDLE_WITHOUT: 'development:test'
      EXECJS_RUNTIME: Disabled
      RAILS_ENV: 'production'
      RAILS_SERVE_STATIC_FILES: 'true'
  image: chatwoot-custom:latest
  restart: unless-stopped
  volumes:
    - chatwoot-storage:/app/storage
  # Alternativa: reemplazar todo el bloque environment por `env_file: .env`
  # (Dokploy escribe el .env junto al compose con lo que pongas en Environment).
  # Conviene si vas a manejar muchas vars (SMTP, S3, canales, etc.).
  environment:
    - FRONTEND_URL=${FRONTEND_URL}
    - SECRET_KEY_BASE=${SECRET_KEY_BASE}
    - FORCE_SSL=${FORCE_SSL}
    - DEFAULT_LOCALE=${DEFAULT_LOCALE}
    - ACTIVE_STORAGE_SERVICE=${ACTIVE_STORAGE_SERVICE}
    - ENABLE_ACCOUNT_SIGNUP=${ENABLE_ACCOUNT_SIGNUP}
    - RAILS_ENV=production
    - NODE_ENV=production
    - INSTALLATION_ENV=docker
    - RAILS_LOG_TO_STDOUT=${RAILS_LOG_TO_STDOUT}
    - LOG_LEVEL=${LOG_LEVEL}
    - POSTGRES_HOST=${POSTGRES_HOST}
    - POSTGRES_PORT=${POSTGRES_PORT}
    - POSTGRES_DATABASE=${POSTGRES_DATABASE}
    - POSTGRES_USERNAME=${POSTGRES_USERNAME}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - REDIS_URL=${REDIS_URL}
    - REDIS_PASSWORD=${REDIS_PASSWORD}

services:
  chatwoot:
    <<: *chatwoot-base
    depends_on:
      - postgres
      - redis
    entrypoint: docker/entrypoints/rails.sh
    command:
      - sh
      - -c
      - bundle exec rails db:chatwoot_prepare && bundle exec rails s -p 3000 -b 0.0.0.0
    expose:
      - "3000"

  chatwoot-worker:
    <<: *chatwoot-base
    depends_on:
      - postgres
      - redis
    command:
      - bundle
      - exec
      - sidekiq
      - -C
      - config/sidekiq.yml

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    volumes:
      - chatwoot-postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

  redis:
    image: redis:alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - redis-server --requirepass "$$REDIS_PASSWORD"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - chatwoot-redis-data:/data

volumes:
  chatwoot-storage:
  chatwoot-postgres-data:
  chatwoot-redis-data: